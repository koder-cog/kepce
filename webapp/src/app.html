<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F9F5E5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#242828" media="(prefers-color-scheme: dark)">

  <!-- Font Preload Optimizasyonu (FCP & CLS İyileştirme) -->
  <link rel="preload" href="/fonts/publicsans-ijwRs572Xtc6ZYQws9YVwnNGfJ4.woff2" as="font" type="font/woff2"
    crossorigin="anonymous" fetchpriority="high" />
  <link rel="preload" href="/fonts/publicsans-ijwRs572Xtc6ZYQws9YVwnNIfJ7Cww.woff2" as="font" type="font/woff2"
    crossorigin="anonymous" fetchpriority="high" />
  <link rel="preload" href="/fonts/paytoneone-0nksC9P7MfYHj2oFtYm2ChTjgPvNiA.woff2" as="font" type="font/woff2"
    crossorigin="anonymous" />
  <link rel="preload" href="/fonts/paytoneone-0nksC9P7MfYHj2oFtYm2ChTtgPs.woff2" as="font" type="font/woff2"
    crossorigin="anonymous" />

  <!-- PWA -->
  <link rel="manifest" href="%sveltekit.assets%/manifest.json" />

  <style>
    /* FOUC (Flash of Unstyled Content) / Flashbang önleyici */
    html {
      background-color: #F9F5E5;
      color: #242828;
      color-scheme: light dark;
    }

    html.dark {
      background-color: #242828;
      color: #F9F5E5;
      color-scheme: dark;
    }

    html.light {
      background-color: #F9F5E5;
      color: #242828;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      html:not(.light) {
        background-color: #242828;
        color: #F9F5E5;
        color-scheme: dark;
      }
    }
  </style>

  <script>
    (function() {
      window.applyTheme = function(themeStr, isInit = false) {
        const el = document.documentElement;
        const updateDOM = () => {
          if (themeStr === 'koyu') {
            el.classList.add('dark');
            el.classList.remove('light');
          } else if (themeStr === 'acik') {
            el.classList.add('light');
            el.classList.remove('dark');
          } else {
            el.classList.remove('dark', 'light');
          }
        };
        if (!isInit && typeof document.startViewTransition === 'function') {
          try {
            const transition = document.startViewTransition(updateDOM);
            if (transition) {
              if (transition.ready) transition.ready.catch(() => {});
              if (transition.finished) transition.finished.catch(() => {});
            }
          } catch (_) {
            updateDOM();
          }
        } else {
          if (!isInit) {
            el.classList.add('theme-transitioning');
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                updateDOM();
                window.setTimeout(() => {
                  el.classList.remove('theme-transitioning');
                }, 500);
              });
            });
          } else {
            updateDOM();
          }
        }
      };
      const syncThemeState = function() {
        const savedTheme = localStorage.getItem('renkTercihi') || 'sistem';
        window.applyTheme(savedTheme, true);
        if (localStorage.getItem('kepce_show_bot') === 'false') {
          document.documentElement.classList.add('hide-ai');
        } else {
          document.documentElement.classList.remove('hide-ai');
        }
      };

      syncThemeState();

      window.addEventListener('popstate', syncThemeState);
      window.addEventListener('pageshow', syncThemeState);
    })();
  </script>
  <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
  <title>Kepçe - KYK Yurt Yemek Menüsü</title>
  <meta name="description"
    content="KYK yurtları günlük sabah kahvaltısı ve akşam yemeği menüleri, besin değerleri, öğrenci yorumları ve yemekhane istatistikleri." />
  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
  <div id="tooltip-portal" class="tooltip-portal"></div>
  <script defer src="https://analitik.kepce.org/script.js"
    data-website-id="6914d829-f2d1-45b5-bcb0-b790d831c1bd"></script>
</body>

</html>

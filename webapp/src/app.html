<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F9F5E5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#242828" media="(prefers-color-scheme: dark)">

  <!-- Font Preload Optimizasyonu (FCP & CLS İyileştirme) -->
  <link rel="preload" href="/fonts/publicsans-ijwRs572Xtc6ZYQws9YVwnNGfJ4.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  <link rel="preload" href="/fonts/paytoneone-0nksC9P7MfYHj2oFtYm2ChTtgPs.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

  <!-- PWA -->
  <link rel="manifest" href="%sveltekit.assets%/manifest.json" />

  <style>
    /* FOUC (Flash of Unstyled Content) / Flashbang önleyici */
    html { background-color: #F9F5E5; color: #242828; color-scheme: light dark; }
    html.dark { background-color: #242828; color: #F9F5E5; color-scheme: dark; }
    html.light { background-color: #F9F5E5; color: #242828; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      html:not(.light) { background-color: #242828; color: #F9F5E5; color-scheme: dark; }
    }
  </style>

  <script src="%sveltekit.assets%/theme-init.js" defer></script>
  <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
  <div id="tooltip-portal" class="tooltip-portal"></div>
</body>
</html>

name: KykYemek Remote Scraper

on:
  schedule:
    # Günde iki kez: Sabah 06:15 UTC (09:15 TSİ) ve Öğleden sonra 14:15 UTC (17:15 TSİ)
    - cron: '15 6,14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run modu (API aktarımı yapmaz, sadece kazır ve parse eder)'
        required: false
        type: boolean
        default: false
      city:
        description: 'Belirli bir şehir slug (boş bırakılırsa tüm aktif iller taranır)'
        required: false
        type: string
        default: ''

jobs:
  scrape-and-ingest:
    name: Scrape and Ingest KykYemek
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Remote Scraper
        env:
          INTERNAL_INGEST_URL: ${{ secrets.INTERNAL_INGEST_URL || 'https://kepce.org/api/v1/internal/ingest/kykyemek' }}
          INTERNAL_INGEST_SECRET: ${{ secrets.INTERNAL_INGEST_SECRET }}
          KYKYEMEK_PROXY_TOOL: ${{ secrets.KYKYEMEK_PROXY_TOOL }}
          RUST_LOG: info
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.city }}" ]; then
            ARGS="$ARGS --city ${{ inputs.city }}"
          fi
          echo "Çalıştırılıyor: cargo run --release --bin remote_scraper -- $ARGS"
          cargo run --release --bin remote_scraper -- $ARGS

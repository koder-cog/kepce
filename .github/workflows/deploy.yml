name: Deploy

# main'e push -> ARM64 imajlari derle -> GHCR'a gonder -> sunucuda pull + restart
# Gereken repo secret'lari:
#   DEPLOY_HOST  (orn. ubuntu@130.110.247.87)
#   DEPLOY_USER  (orn. ubuntu)
#   DEPLOY_KEY   (SSH private key, PEM icerigi)
# Sunucuda bir kerelik: ghcr.io login (public paket icin gerekmez) +
#   docker compose pull'in calisabilmesi icin compose dosyalari scp ile guncellenir.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-images:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Native aarch64 binary derle (rust:trixie + g++)
        run: |
          docker run --rm -v "$PWD":/app -w /app rust:trixie bash -c "
            set -euo pipefail
            apt-get update -qq && apt-get install -y -qq pkg-config libssl-dev g++ >/dev/null
            cargo build --release -p api -p worker
            mkdir -p target/aarch64-unknown-linux-gnu/release
            cp target/release/api target/release/worker target/aarch64-unknown-linux-gnu/release/
          "

      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Imajlari derle ve gonder
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          docker build -f api/Dockerfile       -t ghcr.io/$OWNER/kepce-api:latest -t ghcr.io/$OWNER/kepce-api:$SHORT_SHA       .
          docker build -f worker/Dockerfile    -t ghcr.io/$OWNER/kepce-worker:latest -t ghcr.io/$OWNER/kepce-worker:$SHORT_SHA    .
          docker build -f webapp/Dockerfile    -t ghcr.io/$OWNER/kepce-webapp:latest -t ghcr.io/$OWNER/kepce-webapp:$SHORT_SHA    ./webapp
          docker push ghcr.io/$OWNER/kepce-api:latest
          docker push ghcr.io/$OWNER/kepce-api:$SHORT_SHA
          docker push ghcr.io/$OWNER/kepce-worker:latest
          docker push ghcr.io/$OWNER/kepce-worker:$SHORT_SHA
          docker push ghcr.io/$OWNER/kepce-webapp:latest
          docker push ghcr.io/$OWNER/kepce-webapp:$SHORT_SHA

  deploy-server:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compose ve config dosyalarini sunucuya gonder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "Caddyfile,docker-compose.yml,docker-compose.prod.yml,docker-compose.analytics.yml,static/maintenance.html,docker-compose.search.yml,docker-compose.tunnel.yml"
          target: ~/kepce/
          overwrite: true

      - name: Sunucuda pull + yeniden baslat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd ~/kepce
            # .env yalnizca ihtiyac duyulan degisken icin deterministik okunur.
            # 'export $(grep ... | xargs)' bosluk veya tirnak iceren degerlerde
            # zinciri kirar ve sonraki degiskenleri sessizce dusurur.
            POSTGRES_USER_VAL="$(grep '^POSTGRES_USER=' .env 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | tr -d '\r' || true)"
            export POSTGRES_USER="${POSTGRES_USER_VAL:-kepce_admin}"

            # Umami veritabani hazirligi (varsa dokunmaz)
            docker exec kepce-db psql -U "${POSTGRES_USER:-kepce_admin}" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'umami'" 2>/dev/null | grep -q 1 || \
            docker exec kepce-db psql -U "${POSTGRES_USER:-kepce_admin}" -d postgres -c "CREATE DATABASE umami;" 2>/dev/null || true

            # Tunnel modu: token dogrudan .env'den okunur, export zincirine bagimli
            # degildir (deger bosluk veya tirnak icerebilir).
            TUNNEL_TOKEN="$(grep '^CLOUDFLARE_TUNNEL_TOKEN=' .env 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | tr -d '\r' || true)"

            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.analytics.yml -f docker-compose.search.yml -f docker-compose.tunnel.yml"

            # Tunnel profili yalnizca token tanimliyken acilir. Bos token ile
            # cloudflared baslatilirsa konteyner hata dongusune girer.
            PROFILE_ARGS=""
            PULL_TARGETS="api webapp worker searxng umami"
            if [ -n "$TUNNEL_TOKEN" ]; then
              PROFILE_ARGS="--profile tunnel"
              PULL_TARGETS="$PULL_TARGETS cloudflared"
            fi

            docker compose $COMPOSE_FILES $PROFILE_ARGS pull $PULL_TARGETS
            docker compose $COMPOSE_FILES $PROFILE_ARGS up -d --remove-orphans
            # Caddyfile dogrulamasi: scp ile gelen dosya gecersizse caddy'yi yeniden
            # baslatmadan dur. Calisan caddy bellekteki saglam yapilandirmayla hizmet
            # vermeye devam eder, boylece hatali yapilandirma siteyi dusurmez.
            docker exec kepce-caddy caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile \
              || { echo "DEPLOY_HATASI: Caddyfile gecersiz, caddy yeniden baslatilmadi"; exit 1; }
            docker restart kepce-caddy
            docker image prune -f

            # Saglik kapisi: tunnel bekleniyorsa origin kapali kalmali ve site
            # tünel uzerinden yanit vermeli. Saglanmazsa sessiz kesinti yerine
            # deploy hata ile durur ve Telegram alarmi tetiklenir.
            if [ -n "$TUNNEL_TOKEN" ] || docker ps -a --format '{{.Names}}' | grep -qx kepce-cloudflared; then
              if [ -z "$TUNNEL_TOKEN" ]; then
                echo "DEPLOY_HATASI: cloudflared mevcut ama CLOUDFLARE_TUNNEL_TOKEN tanimli degil"
                exit 1
              fi
              docker ps --format '{{.Names}}' | grep -qx kepce-cloudflared \
                || { echo "DEPLOY_HATASI: cloudflared ayakta degil"; exit 1; }
              docker port kepce-caddy | grep -q '443/tcp -> 127.0.0.1:443' \
                || { echo "DEPLOY_HATASI: caddy 443 portu loopback adresine bagli degil"; exit 1; }
              # Yerel katman: Cloudflare'den bagimsiz olarak Caddy ve webapp ayakta mi.
              # -k gerekir, origin Cloudflare Origin Certificate kullanir.
              curl -fsS -k -o /dev/null --max-time 10 --resolve kepce.org:443:127.0.0.1 https://kepce.org/ \
                || { echo "DEPLOY_HATASI: caddy loopback yanit vermiyor"; exit 1; }
              # Uctan uca: tünel ve Cloudflare uzerinden site erisilebilir mi.
              HEALTHY=0
              for _ in 1 2 3 4 5 6; do
                if curl -fsS -o /dev/null --max-time 10 https://kepce.org/; then HEALTHY=1; break; fi
                sleep 5
              done
              [ "$HEALTHY" = "1" ] || { echo "DEPLOY_HATASI: kepce.org yanit vermiyor"; exit 1; }
              echo "TUNNEL_OK"
            fi

            echo "DEPLOY_OK"

      - name: Telegram Bildirimi (Hata Durumu)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\": \"${TELEGRAM_ADMIN_CHAT_ID}\", \"text\": \"[CI/CD ALARM] Kepçe Deploy Başarısız Oldu!\n\n• Branch: \`${GITHUB_REF_NAME}\`\n• Commit: \`${GITHUB_SHA}\`\n• Yapan: ${GITHUB_ACTOR}\", \"parse_mode\": \"Markdown\"}"
          fi

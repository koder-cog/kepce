use_default_settings: true

general:
  debug: false
  instance_name: "Kepçe Ara"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "kepce_searxng_production_secret_key_change_me"
  image_proxy: true

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  autocomplete_min: 2
  default_lang: "auto"
  request_timeout: 5.0
  formats:
    - html
    - json

outgoing:
  request_timeout: 5.0
  max_request_timeout: 8.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

enabled_plugins:
  - 'Calculator'
  - 'Unit converter'
  - 'Tracker url remover'
  - 'Hostnames'
  - 'Hash plugin'

engines:
  - name: zapmeta
    engine: zapmeta
    shortcut: zm
    disabled: false
    weight: 4
    timeout: 4.0
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
    weight: 3
    timeout: 3.0
  - name: google
    engine: google
    shortcut: g
    disabled: false
    weight: 2
    timeout: 3.0
  - name: wikipedia
    engine: wikipedia
    shortcut: w
    disabled: false
    weight: 2
    timeout: 3.0
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
    weight: 1
    timeout: 3.0
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
    weight: 3
    timeout: 3.0
  - name: wikinews
    engine: wikinews
    shortcut: wn
    disabled: false
    weight: 1
    timeout: 3.0
  - name: mojeek
    engine: mojeek
    shortcut: mj
    disabled: false
    weight: 1
    timeout: 3.0
  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: true

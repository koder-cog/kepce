use_default_settings: true

general:
  debug: false
  instance_name: "Kepçe Ara"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "kepce_searxng_production_secret_key_change_me"
  image_proxy: true

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  autocomplete_min: 2
  default_lang: "auto"
  request_timeout: 3.0
  formats:
    - html
    - json
    - rss
    - csv

outgoing:
  request_timeout: 2.0
  max_request_timeout: 3.5
  pool_connections: 100
  pool_maxsize: 50
  enable_http2: true

enabled_plugins:
  - 'Calculator'
  - 'Unit converter'
  - 'Tracker url remover'
  - 'Hostnames'
  - 'Hash plugin'

engines:
  # ── 1. Web & Genel Arama ───────────────────────────────────
  - name: bing
    engine: bing
    disabled: false
    weight: 4
    timeout: 2.0
  - name: wikipedia
    engine: wikipedia
    disabled: false
    weight: 3
    timeout: 1.5
  - name: qwant
    engine: qwant
    disabled: true
  - name: vimeo
    engine: vimeo
    disabled: true
  - name: semantic scholar
    engine: semantic_scholar
    disabled: true
  - name: google
    engine: google
    disabled: false
    weight: 2
    timeout: 2.0
  - name: duckduckgo
    engine: duckduckgo
    disabled: false
    weight: 2
    timeout: 2.0
  - name: brave
    engine: brave
    disabled: false
    weight: 1
    timeout: 2.0

  # ── 2. Haberler (News) ─────────────────────────────────────
  - name: bing news
    engine: bing_news
    disabled: false
    weight: 3
    timeout: 2.0
  - name: google news
    engine: google_news
    disabled: false
    weight: 3
    timeout: 2.0

  # ── 3. Kod & Geliştirici (IT) ──────────────────────────────
  - name: github
    engine: github
    disabled: false
    weight: 3
    timeout: 2.0
  - name: gitlab
    engine: gitlab
    disabled: false
    weight: 2
    timeout: 2.0
  - name: npm
    engine: npm
    disabled: false
    weight: 2
    timeout: 2.0
  - name: pypi
    engine: pypi
    disabled: false
    weight: 2
    timeout: 2.0

  # ── 4. Bilim & Akademi (Science) ───────────────────────────
  - name: arxiv
    engine: arxiv
    disabled: false
    weight: 3
    timeout: 2.0
  - name: google scholar
    engine: google_scholar
    disabled: false
    weight: 3
    timeout: 2.0
  - name: pubmed
    engine: pubmed
    disabled: false
    weight: 2
    timeout: 2.0
  - name: crossref
    engine: crossref
    disabled: false
    weight: 2
    timeout: 2.0

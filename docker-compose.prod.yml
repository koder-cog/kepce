services:
  caddy:
    image: caddy:2-alpine
    container_name: kepce-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./static:/srv/static:ro
      - ./certs:/etc/caddy/certs:ro
      - ./logs/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - webapp
      - api

volumes:
  caddy_data:
  caddy_config:

services:
  moderator:
    image: ghcr.io/koder-cog/kepce-moderator:latest
    build:
      context: .
      dockerfile: moderator/Dockerfile
    container_name: kepce-moderator
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PORT=8002
      - HF_ENDPOINT=https://huggingface.co
      - RUST_LOG=info,moderator=debug
    expose:
      - "8002"
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - frontend-net
      - backend-net

  llama:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: kepce-llama
    restart: unless-stopped
    command:
      - "-m"
      - "/models/model.gguf"
      - "--port"
      - "5262"
      - "--host"
      - "0.0.0.0"
      - "-c"
      - "16384"
      - "-t"
      - "4"
    volumes:
      - ${LLAMA_MODEL_DIR:-./models}:/models:ro
    expose:
      - "5262"
    networks:
      - backend-net

volumes:
  hf_cache:

services:
  moderator:
    image: ghcr.io/koder-cog/kepce-moderator:latest
    build:
      context: .
      dockerfile: moderator/Dockerfile
    container_name: kepce-moderator
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PORT=8002
      - HF_ENDPOINT=https://huggingface.co
      - RUST_LOG=info,moderator=debug
    expose:
      - "8002"
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - frontend-net
      - backend-net

volumes:
  hf_cache:

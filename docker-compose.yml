services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: kepce-db
    environment:
      # SA-1: Secret'lar için varsayılan (fallback) değer YOK - env eksikse compose
      # başlamaz. Public repodaki bilinen şifrelerle sessizce ayağa kalkma riski kaldırıldı.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER tanimli olmali (.env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli olmali (.env)}
      POSTGRES_DB: ${POSTGRES_DB:-kepce}
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=pgbackrest --stanza=kepce-stanza archive-push %p"
      - "-c"
      - "max_wal_senders=3"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackrest_data:/opt/kepce/backups/pgbackrest
      - ./db/pgbackrest.conf:/etc/pgbackrest.conf:ro
    ports:
      # SA-1: Sadece localhost'a bağlanır; internete/dış ağa açık değil.
      - "127.0.0.1:5432:5432"
    networks:
      - backend-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      # NOT: api/Dockerfile de önceden derlenmiş binary kopyalar; yukarıdaki
      # worker notu api için de geçerlidir (sunucuda build değil, CI + pull).
    # CI/CD: imajlar GitHub Actions'ta derlenip GHCR'a gonderilir;
    # sunucuda 'docker compose pull' ile alinir (yerel build yedegi).
    image: ghcr.io/koder-cog/kepce-api:latest
    container_name: kepce-api
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER tanimli olmali}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli olmali}@db:5432/${POSTGRES_DB:-kepce}
      # SA-1: Bilinen bir varsayılan JWT secret ile çalışmak = admin token sahteciliği.
      - KEPCE_SECRET_KEY=${KEPCE_SECRET_KEY:?KEPCE_SECRET_KEY tanimli olmali (openssl rand -hex 32)}
      # KEPCE_PII_SECRET_KEY kaldırıldı: kodda hiç kullanılmıyordu (ölü yapılandırma).
      # PII şifrelemesi ileride uygulanırsa KVKK kararıyla birlikte yeniden eklenmeli.
      - KEPCE_CORS_ORIGIN=${KEPCE_CORS_ORIGIN:-http://localhost}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - KEPCE_BASE_URL=${KEPCE_BASE_URL}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:iletisim@kepce.org}
      # Onay sonrası karantina dosyalarının taşınacağı worker dizini (bind mount).
      - MENU_INGEST_DIR=/app/data/menuler
      # Karantina kök dizini (WORKDIR /app'e göreli).
      - MENU_QUARANTINE_DIR=uploads/quarantine/menus
    volumes:
      - uploads:/app/uploads
      - avatars:/app/static/avatars
      # NOT: api konteyneri nobody:nogroup (uid 65534) olarak çalışır. Host'taki
      # ./data/menuler dizini bu kullanıcı tarafından yazılabilir olmalıdır
      # (deploy sırasında chown/chmod gerekebilir), aksi halde onay sonrası
      # dosya taşıma başarısız olur.
      - ./data/menuler:/app/data/menuler
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy

  worker:
    # !!! DİKKAT: worker/Dockerfile DERLEME YAPMAZ. Önceden derlenmiş ARM64
    # binary'yi imaja kopyalar (COPY target/aarch64-unknown-linux-gnu/release/worker).
    # Sunucuda cargo YOKTUR. Bu yüzden sunucuda `docker compose build worker`
    # ÇALIŞTIRILMAMALIDIR: var olan (bayat) binary'yi yeni imaja kopyalar ve
    # kod düzeltmelerini sessizce geri alır (canlıda "0 dosya işlendi" bu şekilde
    # oluştu). Doğru akış: CI (ubuntu-24.04-arm runner) imajı derleyip GHCR'a
    # gönderir; sunucuda yalnızca `docker compose pull worker` + `up -d` çalıştırılır.
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: ghcr.io/koder-cog/kepce-worker:latest
    container_name: kepce-worker
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER tanimli olmali}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli olmali}@db:5432/${POSTGRES_DB:-kepce}
      - WORKER_INTERVAL_SECS=${WORKER_INTERVAL_SECS:-3600}
      - WORKER_MENU_DIR=/app/data/menuler
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Birincil model. Kod, tek model verildiğinde gemini-flash-lite-latest'i
      # yedek olarak OTOMATİK zincire ekler (kota dolduğunda yedeğe düşer).
      # İstenirse virgülle ayrılmış açık liste de verilebilir: "birincil,yedek".
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
      # Muhakeme seviyesi: generation_config.thinking_level ("low" | "high").
      - GEMINI_THINKING_LEVEL=${GEMINI_THINKING_LEVEL:-high}
      # Sağlayıcı sırası: varsayılan OpenRouter (birincil) -> Gemini (yedek).
      # Gemini Free Tier kotası model başına 20 istek/gün olduğundan OpenRouter
      # birincildir; istenirse "gemini,openrouter" ile ters çevrilebilir.
      - LLM_PROVIDER_ORDER=${LLM_PROVIDER_ORDER:-openrouter,gemini}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Varsayılan: ~google/gemini-flash-latest (Gemini Flash ailesinin en günceli).
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-~google/gemini-flash-latest}
      # Muhakeme seviyesi: max|xhigh|high|medium|low|minimal|none
      # NOT: low, çok bölümlü PDF'lerde ikinci tabloyu (ör. Kahvaltı) atlayabilir;
      # medium tam sonuç verir (canlıda doğrulandı: 14 -> 31 gün).
      - OPENROUTER_REASONING_EFFORT=${OPENROUTER_REASONING_EFFORT:-low}
      # Muhakeme token'ları bu bütçeden düşer; medium/high için 16000 YETMEZ.
      - OPENROUTER_MAX_TOKENS=${OPENROUTER_MAX_TOKENS:-32000}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - RUST_LOG=${RUST_LOG:-info}
      - INDEXNOW_KEY=${INDEXNOW_KEY:-}
      - INDEXNOW_HOST=${INDEXNOW_HOST:-kepce.org}
      - INDEXNOW_ENDPOINT=${INDEXNOW_ENDPOINT:-https://api.indexnow.org/indexnow}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:iletisim@kepce.org}
    volumes:
      - ./data/menuler:/app/data/menuler
      - uploads:/app/uploads
      - ./config:/app/config:ro
    networks:
      - backend-net
      - frontend-net
    depends_on:
      db:
        condition: service_healthy

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    image: ghcr.io/koder-cog/kepce-webapp:latest
    container_name: kepce-webapp
    environment:
      # SSR: webapp, container içinden Rust API'ye doğrudan bağlanır
      - API_INTERNAL=http://api:8000
      - PORT=3000
      - HOST=0.0.0.0
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
    expose:
      - "3000"
    networks:
      - frontend-net
    depends_on:
      - api
    restart: unless-stopped
    # SSR Node process'i icin bellek siniri: sizinti durumunda OOM killer'in
    # diger servisleri (api/db) oldurmesini engeller; container yeniden baslar.
    mem_limit: 512m
    memswap_limit: 512m

volumes:
  pgdata:
  uploads:
  avatars:
  pgbackrest_data:

networks:
  frontend-net:
  backend-net:
    internal: true

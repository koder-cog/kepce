# Rust Workspace Konfigürasyonu
# ================================
# Tüm Rust crate'leri (api, worker, shared) bu workspace altında derlenir.
# `cargo build` komutu tüm üyeleri birlikte derler.
# `cargo build -p api` ile sadece API derlenebilir.

[workspace]
members = [
    "api",
    "worker",
    "shared",
    "tools/log-decrypt",
    "tools/migrate-identity"
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"

# Ortak bağımlılıklar - sürüm skew'ini önlemek için tek noktada tanımlanır.
# Alt crate'ler `dependency.workspace = true` ile referans verir.
[workspace.dependencies]
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "stream", "socks", "multipart", "gzip", "brotli"] }
anyhow = "1"
dotenvy = "0.15"
rand = "0.8"

